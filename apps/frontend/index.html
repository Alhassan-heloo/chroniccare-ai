<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg?v=header-pulse-1" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0b1320" />
    <meta
      name="description"
      content="ChronicCare AI — متابعة صحية يومية بخطوات بسيطة"
    />
    <title>ChronicCare AI | صحتك كل يوم</title>
  </head>
  <body>
    <script>
      (() => {
        const mode = localStorage.getItem("cc-theme") || "system";
        const dark = mode === "dark" || (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        const language = localStorage.getItem("cc-language") === "en" ? "en" : "ar";
        document.documentElement.lang = language;
        document.documentElement.dir = language === "ar" ? "rtl" : "ltr";
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
